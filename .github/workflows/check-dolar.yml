name: Chequear dolar Bolivia

on:
  schedule:
    # Respaldo: GitHub puede retrasar (o directamente saltear por horas) los
    # triggers de "schedule" en repos con poco trafico -- se observo en la
    # practica que este cron interno llegaba a espaciarse mas de 4 horas en
    # vez de cada 20 min. Por eso la cadencia real la maneja un cron EXTERNO
    # (cron-job.org, cada 15 min) que llama al endpoint de workflow_dispatch
    # de la API de GitHub -- ver README.md, seccion "Cron externo". Este
    # cron interno queda solo como red de seguridad por si el externo falla.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano (o via el cron externo)

permissions:
  contents: write

concurrency:
  group: check-dolar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar cotizacion y avisar si cambio
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python check_dolar.py

      - name: Guardar cambios (precio y wallpaper)
        run: |
          git config user.name "actualizador-de-dolar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/last_rates.json data/history.json wallpaper/current.png
          git diff --cached --quiet || git commit -m "Actualiza cotizacion del dolar [skip ci]"
          git push
